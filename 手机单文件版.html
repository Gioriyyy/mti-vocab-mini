<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#183a37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="贸大词汇">
  <title>贸大 MTI 词根词缀学习器</title>
  <style>
    :root{--bg:#f7f1e8;--paper:#fffaf4;--ink:#1f2a2d;--muted:#67727a;--line:rgba(31,42,45,.12);--accent:#b64d2d;--accent-soft:#f1d3c3;--deep:#183a37;--success:#2f7d5c;--shadow:0 14px 32px rgba(38,38,38,.08);--radius:20px}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at top right,rgba(211,164,74,.16),transparent 28%),radial-gradient(circle at top left,rgba(182,77,45,.1),transparent 26%),linear-gradient(180deg,#fdf9f3 0%,var(--bg) 100%);color:var(--ink)}
    .app-shell{width:min(100%,760px);margin:0 auto;padding:18px 14px 36px}
    .hero,.panel,.tab-panel{background:rgba(255,250,244,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{padding:22px 18px;position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;inset:auto -40px -45px auto;width:160px;height:160px;border-radius:999px;background:linear-gradient(135deg,rgba(182,77,45,.18),rgba(24,58,55,.08))}
    .eyebrow,.panel-kicker,.micro-title{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
    h1,h2,h3{margin:0;line-height:1.2}
    h1{font-size:28px} h2{font-size:22px}
    .hero-copy,.panel-copy,.metric{color:var(--muted);line-height:1.7}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .hero-meta span,.chip{padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--deep);font-size:13px}
    .content{display:grid;gap:14px;margin-top:14px}
    .panel,.tab-panel{padding:16px}
    .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .ghost-btn{border:1px solid var(--line);background:transparent;color:var(--deep);border-radius:999px;padding:8px 12px}
    .day-switcher{margin-top:16px}
    .day-switcher label{display:block;font-size:14px;margin-bottom:8px;color:var(--muted)}
    .day-switcher select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;font-size:15px}
    .tab-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .tab-bar::-webkit-scrollbar{display:none}
    .tab-btn{border:0;border-radius:16px;padding:12px 8px;background:rgba(255,255,255,.65);color:var(--muted);font-weight:600;white-space:nowrap;flex:0 0 auto;min-width:92px}
    .tab-btn.active{background:var(--deep);color:#fff}
    .tab-panel{display:none;gap:12px}
    .tab-panel.active{display:grid}
    .mini-card{border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:16px;padding:14px}
    .word-row,.task-row,.output-row,.review-row{padding:10px 0;border-top:1px solid rgba(31,42,45,.08)}
    .word-row:first-child,.task-row:first-child,.output-row:first-child,.review-row:first-child{border-top:0;padding-top:0}
    .task-check{display:flex;gap:10px;align-items:flex-start}
    .task-check input{margin-top:4px;accent-color:var(--success)}
    .stat-box{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
    .metric-card{border-radius:16px;background:linear-gradient(160deg,rgba(24,58,55,.95),rgba(56,84,80,.92));color:#fff;padding:14px}
    .metric-card strong{display:block;font-size:26px;margin-bottom:8px}
    .section-title{font-size:18px;margin-bottom:6px}
    .family-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .family-title strong{font-size:18px}
    .family-title span{color:var(--accent);font-size:13px}
    .example{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(211,164,74,.12);color:var(--deep);line-height:1.6}
    .score-banner{padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(182,77,45,.92),rgba(211,164,74,.88));color:#fff}
    .quick-grid,.resource-list,.library-grid,.bank-grid,.root-grid,.uibe-grid,.review-grid{display:grid;gap:12px}
    .quick-step{padding:12px;border-radius:14px;background:rgba(24,58,55,.06);border:1px solid rgba(24,58,55,.08)}
    .quick-step strong{display:block;margin-bottom:6px}
    .resource-link{display:block;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.84);border:1px solid rgba(31,42,45,.08);color:var(--deep);text-decoration:none;line-height:1.5}
    .resource-link:hover{background:rgba(241,211,195,.5)}
    @media(min-width:720px){.root-grid,.uibe-grid,.review-grid,.bank-grid,.library-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <p class="eyebrow">UIBE MTI · Root-Based Vocabulary</p>
      <h1>贸大 MTI 词根词缀学习器</h1>
      <p class="hero-copy">把《华研专八词汇》《17天搞定GRE单词》和 MTI 高频词手册揉成一套手机端学习流程。</p>
      <div class="hero-meta"><span>17 天主摄入</span><span>8 个记忆周期</span><span>MTI 主题输出</span></div>
    </header>
    <main class="content">
      <section class="panel today-panel">
        <div class="panel-head">
          <div><p class="panel-kicker">今日主线</p><h2 id="today-title">Day 1</h2></div>
          <button id="reset-progress" class="ghost-btn">重置今日勾选</button>
        </div>
        <div class="day-switcher"><label for="day-select">选择学习日</label><select id="day-select"></select></div>
        <div id="today-card"></div>
      </section>
      <nav class="tab-bar" aria-label="学习模块">
        <button class="tab-btn active" data-tab="mission">今日任务</button>
        <button class="tab-btn" data-tab="roots">词根家族</button>
        <button class="tab-btn" data-tab="uibe">贸大考向</button>
        <button class="tab-btn" data-tab="review">大词量法</button>
        <button class="tab-btn" data-tab="bank">补充词库</button>
        <button class="tab-btn" data-tab="library">资料总库</button>
      </nav>
      <section id="tab-mission" class="tab-panel active"></section>
      <section id="tab-roots" class="tab-panel"></section>
      <section id="tab-uibe" class="tab-panel"></section>
      <section id="tab-review" class="tab-panel"></section>
      <section id="tab-bank" class="tab-panel"></section>
      <section id="tab-library" class="tab-panel"></section>
    </main>
  </div>
  <script>
    const state={currentDay:1,key:"mti-vocab-mini-mobile-v1"};
    const days=[{day:1,title:"Day 1 · ethics / honor / appropriate",focus:"先建立词根拆词感，不追求一次记全，而是先学会把散词并成词族。",bookRange:"《华研专八》1-60 词",intake:"新词 60-80，核心词根 4 组",roots:["ethic","honor","appropri","manifest"],tasks:["先拆 10 个词，不先看中文，只判断前缀、词根和词性。","把 honor / dishonor / respectable / decency 并成“品格评价”一组。","完成 5 分钟回想、30 分钟回想、晚上回想三轮最小复习。","写 2 句汉译英，主题限定为道德规范和行为得体。"],outputs:["A decent public official should act in accordance with ethical principles.","The funds were misappropriated in violation of financial discipline."]},{day:2,title:"Day 2 · assure / define / therapy",focus:"把抽象动词和学术词并推进，开始适应正式语体。",bookRange:"《华研专八》61-120 词",intake:"新词 70-90，核心词根 4 组",roots:["sure","fin","therap","spir"],tasks:["区分 assure / reassure / ensure。","整理 definition / definitive / define 的派生路径。","完成 5 分钟回想和 30 分钟回想。","做 3 题中译英，练正式表达。"],outputs:["The new policy is intended to reassure investors.","A definitive explanation requires more rigorous evidence."]},{day:3,title:"Day 3 · function / mobil / manifest",focus:"把连续词表重组成词族，开始建立真正的扩词速度。",bookRange:"《华研专八》121-180 词",intake:"新词 70-90，核心词根 4 组",roots:["funct","mob","mot","mani"],tasks:["一口气串记 function / malfunction / functional。","区分 mobile / mobilize / demobilize 的方向变化。","围绕 manifest 写 3 个中文概念对应英文表达。","完成当天晚上打乱顺序复习。"],outputs:["The reform has begun to manifest its structural impact.","The government mobilized resources to stabilize the market."]},{day:4,title:"Day 4 · aggregate / conflate / syndicate",focus:"切入统计、组织、概念辨析类表达，贴近贸大政经文本。",bookRange:"《华研专八》900-1000 词附近",intake:"新词 80-100，主题推进",roots:["greg","flate","sect","dole"],tasks:["把 aggregate / amalgamate / conflate 放在同一张辨析卡上。","分别造句：总量统计、企业联合、概念混淆。","完成 1 天和 2 天节点复习。","口头复述今天最值钱的 15 词。"],outputs:["The report aggregates data from multiple regional markets.","We should not conflate short-term volatility with structural decline."]},{day:5,title:"Day 5 · cred / credit / discredit",focus:"进入贸大高频的公信力、信誉、认证和抹黑表达。",bookRange:"《华研专八》1980-2000 词附近",intake:"新词 80-100，cred 主轴",roots:["cred","eman","hydr","macul"],tasks:["串记 accredit / credit / credible / credibility / discredit。","围绕公信力、认证、抹黑各造 1 句。","把 impeccable / immaculate 放入写作升级词。","完成 4 天节点回收。"],outputs:["Policy credibility depends on transparency and consistent implementation.","The agency was officially accredited by an international body."]},{day:6,title:"Day 6 · decrease / decree / deficit",focus:"正式进入政经主轴，形成财政、法令、逆差词网。",bookRange:"《华研专八》3980-4005 词附近",intake:"新词 90-110，de- 系列与政经词",roots:["cre","ficit","leg","delib"],tasks:["区分 decrease / deficit / defect。","围绕 decree / delegate / deliberate / democracy 写主题句。","做一组财政、治理、法令小词包。","完成 7 天前词汇的第一次集中回收。"],outputs:["The trade deficit narrowed as exports regained momentum.","The decree was issued after prolonged deliberation."]},{day:7,title:"Day 7 · 周中复盘",focus:"这一天不盲冲新词，先把前 6 天压实。",bookRange:"复盘 Day 1-6",intake:"新词减半，复习翻倍",roots:["cred","mob","manifest","deficit"],tasks:["回看错词，重做 20 词中译英。","每个重点词根写出 1 条语义链。","把前 6 天输出句改写成更正式的贸大风格。","做一次 30 分钟限时复盘。"],outputs:["Institutional credibility is central to effective governance.","Regional development requires sustained policy coordination."]},{day:8,title:"Day 8 · trade / finance / policy",focus:"从词根转入主题调词，贴近商贸和政策文本。",bookRange:"政经相关页 + MTI 高频手册 Unit 1",intake:"新词 90-110，主题式摄入",roots:["fer","gress","tract","press"],tasks:["把技术转移、资本流动、政策推进放在同一输出组。","用 fer / gress / tract 各写 2 个贸大场景表达。","从 MTI 高频词手册补 20-30 个主题词。","完成晚上打乱顺序复习。"],outputs:["Technology transfer can enhance industrial competitiveness.","The negotiations made substantial progress on market access."]},{day:9,title:"Day 9 · media / diplomacy / public discourse",focus:"补足媒体、国际关系和公共表达语体。",bookRange:"公共表达词 + MTI 高频手册 Unit 2",intake:"新词 80-100，主题扩展",roots:["voc","dict","claim","mani"],tasks:["做声明、表态、呼吁、谴责词包。","区分 claim / proclaim / disclaimer。","把 public discourse 相关词放进一段新闻翻译里。","完成 1 天、2 天、4 天三轮旧词回收。"],outputs:["The spokesperson reaffirmed the country's commitment to dialogue.","The statement was widely interpreted as a diplomatic signal."]},{day:10,title:"Day 10 · literature / culture / humanities",focus:"保持百科和文化词储备，抬高英汉互译上限。",bookRange:"《华研专八》后段 + MTI 高频手册 Unit 3",intake:"新词 80-100，文化补充",roots:["bio","graph","chron","figur"],tasks:["整理 biography / essay / fiction / figurative language。","区分文学文体与学术说明表达。","写 1 段中译英，主题为文化传播。","完成 7 天节点回收。"],outputs:["Figurative language often enriches the texture of literary expression.","The essay offers a chronological account of cultural change."]},{day:11,title:"Day 11 · ecology / geography / biotechnology",focus:"把生态文明、区域发展、科技农业装进一个输出框架。",bookRange:"science 相关词 + 现有学习单",intake:"新词 80-100，科技生态场景",roots:["bio","geo","photo","tech"],tasks:["把 biodiversity / biotechnology / geographical 做成输出句。","练 3 句汉译英：生态治理、现代农业、区域发展。","区分 science 文本和政策文本的语气。","完成 15 天前旧词的抽查。"],outputs:["Protecting biodiversity is essential to ecological governance.","Geographical conditions shape the pattern of regional development."]},{day:12,title:"Day 12 · governance / law / institution",focus:"强化机构运行、法律规则和治理能力表达。",bookRange:"institutional vocabulary",intake:"新词 90 左右，制度类表达",roots:["jur","leg","ministr","ordin"],tasks:["做机构、法规、执行、授权四个小盒子。","把抽象名词转回动词表达。","练制度性约束、依法治理、行政效率三类句子。","做 20 词反向调用。"],outputs:["Effective governance requires institutional coordination.","Administrative efficiency must be balanced with legal accountability."]},{day:13,title:"Day 13 · commerce / market / negotiation",focus:"把商贸、谈判、市场机制说顺。",bookRange:"trade and market vocabulary",intake:"新词 90-100，商贸输出",roots:["merc","port","cess","valu"],tasks:["做 export / import / portfolio / value 市场词网。","英汉互译各 4 句，主题为外贸与市场准入。","改写 2 句，把普通表达升级成正式书面语。","晚上优先做复习，不够时间可暂缓新词。"],outputs:["Broader market access could stimulate export competitiveness.","The two sides resumed negotiations on tariff adjustment."]},{day:14,title:"Day 14 · review sprint",focus:"进入 GRE 式滚动回收，不再单线摄入。",bookRange:"回看 Day 8-13",intake:"新词少量，复习为主",roots:["cred","gress","port","leg"],tasks:["只抓错词和低熟词。","把最常忘的 20 词拆成 5 个小族。","限时完成 1 段汉译英。","检查哪些词你能认但不会写。"],outputs:["Reform momentum depends on credible policy signals.","Institutional reform should proceed in a prudent and coordinated manner."]},{day:15,title:"Day 15 · simulation day",focus:"直接把记词导向笔头表达，模拟考场调词。",bookRange:"全书混合抽词",intake:"新词 60-80，输出强度最高",roots:["mixed sets"],tasks:["做 15 词中译英默写。","做 1 段政经类汉译英。","做 1 段英译汉，标出你从词根猜出的词。","把 5 个普通词替换成更正式词。"],outputs:["The initiative has generated broad-based support across sectors.","The proposal aims to enhance regulatory coherence."]},{day:16,title:"Day 16 · final consolidation",focus:"把最值钱的词根家族压成可调用语料。",bookRange:"全书重点回收",intake:"新词 50-60，整理压缩",roots:["cred","fer","gress","tract","leg"],tasks:["做 5 张词族总卡片。","每张卡片包含核心义、前后缀、代表词、场景搭配、输出句。","整理自己的错词地图。","做 30 分钟闭卷反推。"],outputs:["Sustained progress requires coordinated institutional support.","The policy was designed to facilitate cross-border cooperation."]},{day:17,title:"Day 17 · 贸大冲刺总复盘",focus:"最后一天不是冲新词，而是把词根能力转成考场动作。",bookRange:"17 天总回顾",intake:"新词最低，输出最高",roots:["all core roots"],tasks:["看到中文概念，先想到词根家族，再想到具体词。","完成 10 句汉译英和 10 句英译汉。","按政经、治理、商贸、文化四类输出高频词。","列出下一轮 30 天滚动复习名单。"],outputs:["Vocabulary mastery becomes useful only when it can be retrieved under pressure.","Root-based learning should ultimately serve translation output."]}];
    const roots=[{root:"cred",meaning:"相信，信任",why:"公信力、信誉、认证、抹黑都靠这组。",words:["credit","credible","credibility","accredit","discredit","creed"],scenario:"政策公信力、国际认证、舆论攻击",example:"Policy credibility matters more than short-term rhetoric."},{root:"gress",meaning:"走，前进",why:"适合写进展、推进、倒退、协商进程。",words:["progress","regress","congress","progressive","aggression"],scenario:"谈判进展、改革推进、社会进步",example:"The negotiations made steady progress after several rounds of consultation."},{root:"fer",meaning:"带来，转移",why:"商贸、技术转移、资本流动都常用。",words:["transfer","confer","defer","infer","refer"],scenario:"技术转移、授予资格、延期处理",example:"Technology transfer can enhance industrial upgrading."},{root:"manifest",meaning:"显现，表明",why:"把普通句写正式时非常好用。",words:["manifest","manifestation","demonstrate","evoke"],scenario:"政策成效、社会反应、趋势显现",example:"The data clearly manifest a shift in consumer behavior."},{root:"mob / mot",meaning:"移动，推动",why:"动员、流动、行动能力都能覆盖。",words:["mobile","mobilize","demobilize","motion","promote"],scenario:"资源动员、劳动力流动、政策推动",example:"The state mobilized resources to support the recovery."},{root:"leg / legis",meaning:"法律，规则",why:"治理、法治、法规文本的核心支撑。",words:["legal","legitimate","legislation","legislative"],scenario:"依法治理、立法程序、合法性",example:"Institutional legitimacy depends on transparent legislation."}];
    const uibe=[{title:"政经政策",detail:"重点储备 policy, governance, regulation, fiscal, deficit, coordination 这类正式抽象词。",action:"每天至少写 2 句政策类汉译英。"},{title:"国际商贸",detail:"围绕 trade, market access, competitiveness, export, import, negotiation 建立主题词网。",action:"把词根族转成商贸段落表达，而不只是认单词。"},{title:"机构治理",detail:"贸大答案很看重机构、法律、执行、授权这类冷静正式语体。",action:"遇到 administration, authority, decree, delegate 一类词要会写会替换。"},{title:"媒体外交",detail:"新闻翻译和公共表达要求你会说表态、谴责、回应、重申、呼吁。",action:"按声明类动词单独建卡。"},{title:"百科文化",detail:"文学文化、宗教人文词不能全丢，它们能抬高英汉互译上限。",action:"每周给文史文化留出 1 天补充。"},{title:"MTI 高频速背手册的用法",detail:"这本手册适合补充高频主题词，不适合完全替代词根主线。",action:"每天从对应 Unit 补 20-30 词，用来做主题输出，而不是脱离场景单背。"}];

    function renderReview(){document.getElementById("tab-review").innerHTML=`<div class="mini-card"><p class="micro-title">8 个记忆周期</p>${cycles.map(c=>`<div class="review-row"><strong>${c[0]} · ${c[1]}</strong>：${c[2]} <span class="chip">${c[3]}</span></div>`).join("")}</div><div class="mini-card"><p class="micro-title">两条铁律</p>${fast.map(x=>`<div class="review-row">${x}</div>`).join("")}</div><div class="mini-card"><p class="micro-title">A / B / C 三层掌握</p><div class="review-row"><strong>A 类：</strong>政经、治理、商贸、媒体外交词。要求会写、会用、会汉译英。</div><div class="review-row"><strong>B 类：</strong>抽象学术词、专八高阶词、文化百科词。要求能认、能猜、能逐步转入输出。</div><div class="review-row"><strong>C 类：</strong>低频冷词和暂时不常用词。先混脸熟，先滚动见面，不急着一次吃透。</div><div class="review-row"><strong>大词量标准：</strong>不是所有词都同一深度，而是核心词能打仗，大量高阶词有识别力。</div></div></div>`}
    function renderBank(){document.getElementById("tab-bank").innerHTML=`<div class="mini-card"><p class="micro-title">说明</p><h3 class="section-title">首批真实补词已经并进来了</h3><p class="panel-copy">这里先放我已经从《华研专八》和 MTI 手册里抽出来的高价值词。它不是“全书全部录入”，但已经足够让你按 GRE 式周期开始滚动扩词。</p></div><div class="mini-card"><p class="micro-title">怎么用这栏</p><div class="review-row">先学“今日任务”里的主线，不要一上来全看完。</div><div class="review-row">当天学完后，再来这栏补 10-30 个同主题词。</div><div class="review-row">A 类词优先会写会用，B 类词先认得，C 类词先混脸熟。</div><div class="review-row">补词后照样走 5 分钟、30 分钟、晚上 12 小时回想。</div></div><div class="bank-grid">${tem8.map(x=>`<article class="mini-card"><p class="micro-title">${x.source}</p><h3 class="section-title">${x.title}</h3><p class="panel-copy">${x.use}</p><div class="word-row">${x.words.join(" / ")}</div></article>`).join("")}${hand.map(x=>`<article class="mini-card"><p class="micro-title">${x.source}</p><h3 class="section-title">${x.title}</h3><p class="panel-copy">${x.use}</p><div class="word-row">${x.words.join(" / ")}</div></article>`).join("")}${gre.map(x=>`<article class="mini-card"><p class="micro-title">GRE 桥接包</p><h3 class="section-title">${x.title}</h3><p class="panel-copy">${x.idea}</p><div class="word-row">${x.words.join(" / ")}</div></article>`).join("")}</div>`}
    function renderLibrary(){document.getElementById("tab-library").innerHTML=`<div class="mini-card"><p class="micro-title">资料总库</p><h3 class="section-title">尽量都塞进一个入口了</h3><p class="panel-copy">这里把你现有的核心资料、执行表、词库、训练册、每日学习单和源 PDF 收到一起。日常直接用“今日任务”，需要展开时来这里找对应材料。</p></div><div class="library-grid">${library.map(g=>`<article class="mini-card"><p class="micro-title">资料分组</p><h3 class="section-title">${g.title}</h3><p class="panel-copy">${g.detail}</p><div class="resource-list">${g.files.map(([l,h])=>`<a class="resource-link" href="${h}" target="_blank" rel="noopener noreferrer">${l}</a>`).join("")}</div></article>`).join("")}</div>`}
    dayOption(); renderToday(); renderRoots(); renderUIBE(); renderReview(); renderBank(); renderLibrary(); bindTabs(); bindActions();
